<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" role="img" aria-labelledby="t d"><title id="t">Robot force sensor communication architecture</title><desc id="d">Six force sensors connect through bridge circuits to a Teensy, then through a differential RS-485 link to a Nucleo receiver.</desc><rect width="800" height="310" fill="#142329"/><g font-family="system-ui,sans-serif" fill="#ecf2f8" text-anchor="middle"><text x="400" y="36" font-size="17" fill="#76e4c1" letter-spacing="2">ROBOT SENSOR DATA LINK</text><g fill="#121c27" stroke="#76e4c1" stroke-width="2"><rect x="24" y="94" width="166" height="104" rx="8"/><rect x="226" y="94" width="142" height="104" rx="8"/><rect x="432" y="94" width="142" height="104" rx="8"/><rect x="610" y="94" width="166" height="104" rx="8"/></g><g font-size="16" font-weight="bold"><text x="107" y="125">6 force sensors</text><text x="297" y="125">Teensy 4.1</text><text x="503" y="125">RS-485</text><text x="693" y="125">STM32 Nucleo</text></g><g font-size="13" fill="#aab8c7"><text x="107" y="150">A502 / bridges</text><text x="297" y="150">ADC / serial</text><text x="503" y="150">Differential link</text><text x="693" y="150">F767ZI receiver</text><text x="107" y="175">Robot foot</text><text x="297" y="175">Sensor interface</text><text x="503" y="175">2 m design target</text><text x="693" y="175">Robot chest</text></g><g stroke="#76e4c1" stroke-width="2" fill="none"><path d="M190 146h36m-7-5 7 5-7 5M368 140h64m-7-5 7 5-7 5M368 152h64M574 146h36m-7-5 7 5-7 5"/></g><text x="400" y="246" font-size="26" font-weight="bold" fill="#76e4c1">921.6 kbps</text><text x="400" y="272" font-size="13" fill="#aab8c7">Reported serial transfer rate · Conceptual diagram</text></g></svg>